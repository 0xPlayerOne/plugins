name: Marketplace Synchronization

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      bootstrap-only:
        description: Publish the checked-in last-known-good catalog without live upstream retrieval.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: marketplace-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare bootstrap report
        if: inputs['bootstrap-only'] == true
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('generated/catalog.v1.json','utf8')); const report={ok:true,changed:false,dryRun:false,sourceHeads:c.sources.map(s=>({sourceId:s.sourceId,commitSha:s.resolvedCommitSha})),changeReport:{schemaVersion:1,changedSources:[],addedPlugins:[],removedPlugins:[],changedPlugins:[],permissionSensitiveChanges:[],contentResolution:'complete'},catalogId:c.catalogId,pluginCount:c.plugins.length,sourceCount:c.sources.length}; fs.writeFileSync(process.env.RUNNER_TEMP + '/catalog-change-report.json', JSON.stringify(report));"
      - name: Resolve and build catalog
        id: sync
        if: inputs['bootstrap-only'] != true
        run: bun packages/cli/src/index.ts sync --json | tee "$RUNNER_TEMP/catalog-change-report.json"
      - name: Validate catalog
        run: bun run catalog validate --json
      - name: Determine publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          catalog_id=$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('generated/catalog.v1.json','utf8')); process.stdout.write(c.catalogId)")
          tag="catalog/${catalog_id#catalog:}"
          changed=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/catalog-change-report.json','utf8')); process.stdout.write(String(r.changed === true))")
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)
          bootstrap=false
          for artifact in catalog.v1.json catalog-summary.v1.json categories.v1.json compatibility.v1.json integrity.json sources.lock.json catalog-latest.v1.json; do
            if ! printf '%s\n' "$assets" | grep -Fxq "$artifact"; then
              bootstrap=true
            fi
          done
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          is_latest=false
          if [ "$latest_tag" = "$tag" ]; then
            is_latest=true
          fi
          publish=false
          if [ "$changed" = true ] || [ "$bootstrap" = true ] || [ "$is_latest" != true ]; then
            publish=true
          fi
          {
            echo "catalog_id=$catalog_id"
            echo "release_tag=$tag"
            echo "bootstrap=$bootstrap"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - name: Commit generated snapshot
        id: commit
        run: |
          changed=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/catalog-change-report.json','utf8')); process.stdout.write(String(r.changed === true))")
          if [ "$changed" != "true" ]; then
            echo 'No source changed; generated catalog remains untouched.'
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated
          git commit -m "chore(catalog): refresh marketplace snapshot"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish immutable catalog release
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.publication.outputs.release_tag }}'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              generated/catalog.v1.json \
              generated/catalog-summary.v1.json \
              generated/categories.v1.json \
              generated/compatibility.v1.json \
              generated/integrity.json \
              generated/sources.lock.json \
              --target "$(git rev-parse HEAD)" \
              --latest \
              --title "Marketplace catalog $tag" \
              --notes-file "$RUNNER_TEMP/catalog-change-report.json"
          else
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)
            for artifact in catalog.v1.json catalog-summary.v1.json categories.v1.json compatibility.v1.json integrity.json sources.lock.json; do
              if ! printf '%s\n' "$assets" | grep -Fxq "$artifact"; then
                gh release upload "$tag" "generated/$artifact"
              fi
            done
          fi
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if ! printf '%s\n' "$assets" | grep -Fxq 'catalog-latest.v1.json'; then
            latest_asset="$RUNNER_TEMP/catalog-latest.v1.json"
            cp generated/catalog.v1.json "$latest_asset"
            gh release upload "$tag" "$latest_asset"
          fi
          gh release edit "$tag" --draft=false --latest
      - name: Verify published catalog assets
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/catalog-release"
          mkdir -p "$release_dir"
          gh release download '${{ steps.publication.outputs.release_tag }}' --dir "$release_dir" --pattern '*.json'
          bun run verify:published -- "$release_dir"
          cmp "$release_dir/catalog.v1.json" "$release_dir/catalog-latest.v1.json"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = '${{ steps.publication.outputs.release_tag }}'
