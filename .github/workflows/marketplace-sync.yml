name: Marketplace Synchronization

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.1'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve and build catalog
        id: sync
        run: bun run catalog sync --json | tee "$RUNNER_TEMP/catalog-change-report.json"
      - name: Validate catalog
        run: bun run catalog validate --json
      - name: Commit generated snapshot
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/catalog-change-report.json','utf8')); process.stdout.write(String(r.changed === true))")
          if [ "$changed" != "true" ]; then
            echo 'No source changed; generated catalog remains untouched.'
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          catalog_id=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/catalog-change-report.json','utf8')); process.stdout.write(r.catalogId)")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated
          git commit -m "chore(catalog): refresh marketplace snapshot"
          git push origin HEAD:main
          tag="catalog/${catalog_id#catalog:}"
          git tag "$tag"
          git push origin "$tag"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish immutable catalog release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.commit.outputs.tag }}" generated/*.json \
            --title "Marketplace catalog ${{ steps.commit.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/catalog-change-report.json"
          gh release upload "${{ steps.commit.outputs.tag }}" generated/catalog.v1.json#catalog-latest.v1.json
